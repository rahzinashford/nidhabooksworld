services:
  - type: web
    name: street-books
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    envVars:
      - key: ADMIN_PASSWORD
        sync: false        # set this manually in the Render dashboard
      - key: SESSION_SECRET
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.0
